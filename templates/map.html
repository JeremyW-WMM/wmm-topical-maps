<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:#0d1520;
  font-family:"Segoe UI",Calibri,-apple-system,BlinkMacSystemFont,sans-serif;color:#e6edf5;overflow:hidden}
#header{position:fixed;top:0;left:0;right:0;height:56px;background:#111c2b;
  border-bottom:1px solid #2d4a6e;display:flex;align-items:center;padding:0 14px;z-index:100}
#header h1{font-size:15px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#header h1 small{display:block;font-size:10.5px;font-weight:400;color:#8ab4e0;letter-spacing:.04em;text-transform:uppercase}
#controls{margin-left:auto;display:flex;gap:7px;align-items:center;flex-shrink:0}
button.ctl{background:#1d3350;border:1px solid #2d4a6e;color:#d5e4f5;font-size:12px;
  padding:7px 12px;border-radius:6px;cursor:pointer;font-family:inherit;white-space:nowrap}
button.ctl:hover{background:#28466d;border-color:#4a7ab5}
#stats{position:fixed;top:56px;left:0;right:0;background:#0f1a28;
  border-bottom:1px solid #1e3350;display:flex;align-items:center;flex-wrap:wrap;
  gap:8px 15px;padding:8px 16px;font-size:11.5px;color:#9fb6d0;z-index:90;white-space:nowrap}
#stats b{color:#e6edf5}
.lg{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#9fb6d0}
.lg i{width:10px;height:10px;border-radius:2px;display:inline-block}
#canvas-wrap{position:fixed;top:92px;left:0;right:0;bottom:0;overflow:hidden;transition:right .25s ease}
svg{width:100%;height:100%;cursor:grab;display:block}
svg.dragging{cursor:grabbing}
#tooltip{position:fixed;display:none;background:#1b2a3d;border:1px solid #3a5f8f;border-radius:6px;
  padding:8px 11px;font-size:12px;max-width:320px;pointer-events:none;z-index:200;
  box-shadow:0 8px 24px rgba(0,0,0,.55);line-height:1.45}
#panel{position:fixed;top:56px;right:0;width:320px;bottom:0;background:#151f2e;
  border-left:1px solid #2d4a6e;z-index:50;transform:translateX(100%);transition:transform .25s ease;
  display:flex;flex-direction:column}
#panel.open{transform:translateX(0)}
#p-head{display:flex;align-items:flex-start;gap:8px;padding:14px 14px 10px;border-bottom:1px solid #22354d}
#p-title{font-size:14px;font-weight:600;line-height:1.35;flex:1}
#p-close{background:none;border:none;color:#8ab4e0;font-size:19px;cursor:pointer;line-height:1;padding:0 2px}
#p-close:hover{color:#fff}
#p-body{padding:14px;overflow-y:auto;flex:1;font-size:12.5px;line-height:1.6}
#p-body h4{margin:16px 0 6px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#7fa5cf;font-weight:600}
#p-body h4:first-child{margin-top:0}
#p-query{font-style:italic;color:#cfe0f2;background:#101a27;border-left:2px solid #3a5f8f;padding:8px 10px;border-radius:0 4px 4px 0}
#p-desc{color:#c8d6e6;margin:0}
#p-crumb{font-size:10.5px;color:#6f8cae;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:10.5px;padding:3px 9px;border-radius:11px;font-weight:600;border:1px solid transparent}
#p-lt{color:#9fd0ff}
#p-status{display:inline-block;font-size:11px;font-weight:700;padding:5px 12px;border-radius:5px}
#p-url a{color:#7fc0ff;word-break:break-all;font-size:11.5px}
#p-done{width:100%;margin-top:20px;padding:10px;border-radius:6px;border:1px solid #2d6e4a;
  background:#16351f;color:#7ee2a0;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
#p-done.done{background:#1f7a45;color:#fff;border-color:#28a745}
#p-body::-webkit-scrollbar{width:8px}
#p-body::-webkit-scrollbar-thumb{background:#2d4a6e;border-radius:4px}
</style>
</head>

</div>

<script>
const COLORS = {{COLORS}};
const DATA   = {{DATA}};
const DETAIL = {{DETAIL}};

const LEVEL_SIZES = [180,148,128,158];
const LEVEL_H     = [52,46,42,54];
const H_GAP = 44, V_GAP = 10;

const svgEl = document.getElementById("svg");
const g     = document.getElementById("g");
const NS    = "http://www.w3.org/2000/svg";
const collapsed = new Set();
const done = new Set();
let transform = {x:60,y:0,scale:1};
let current = null;

function el(n,a){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;}
function isCollapsed(n){return collapsed.has(n);}
function kids(n){return (!n.children||isCollapsed(n))?[]:n.children;}

function lighten(hex,pct){
  const r=parseInt(hex.slice(1,3),16),gg=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  const f=v=>Math.round(v+(255-v)*pct/100).toString(16).padStart(2,"0");
  return "#"+f(r)+f(gg)+f(b);
}
function wrapToLines(raw,nw,fontSize){
  const charsPerLine=Math.max(6,Math.floor(nw/(fontSize*0.58)));
  const words=String(raw).replace(/\n/g," ").split(" ");
  const out=[];let cur="";
  for(const w of words){
    if((cur?cur+" "+w:w).length<=charsPerLine){cur=cur?cur+" "+w:w;}
    else{if(cur)out.push(cur);cur=w;}
  }
  if(cur)out.push(cur);
  return out.slice(0,4);
}

/* ---------------- layout ---------------- */
function measure(node,lv){
  node._level=lv;
  const i=Math.min(lv,3);
  node._w=LEVEL_SIZES[i]; node._h=LEVEL_H[i];
  const ch=kids(node);
  if(!ch.length){node._sh=node._h+V_GAP;return node._sh;}
  let tot=0; ch.forEach(c=>{tot+=measure(c,lv+1);});
  node._sh=Math.max(node._h+V_GAP,tot);
  return node._sh;
}
function place(node,x,yTop){
  node._x=x; node._y=yTop+node._sh/2-node._h/2;
  const ch=kids(node); if(!ch.length)return;
  let tot=0; ch.forEach(c=>tot+=c._sh);
  let cy=yTop+(node._sh-tot)/2;
  ch.forEach(c=>{place(c,x+node._w+H_GAP,cy);cy+=c._sh;});
}

/* ---------------- render ---------------- */
function nodeColor(node){
  let n=node;
  while(n&&!n.color&&n._parent)n=n._parent;
  return (n&&n.color)?n.color:"#2d4a6e";
}
function tagParents(node,parent){
  node._parent=parent||null;
  (node.children||[]).forEach(c=>tagParents(c,node));
}

function renderTree(node){
  const lv=node._level,x=node._x,y=node._y,nw=node._w,nh=node._h;
  const color=nodeColor(node);
  const ch=kids(node);

  ch.forEach(c=>{
    const x1=x+nw,y1=y+nh/2,x2=c._x,y2=c._y+c._h/2,mid=(x1+x2)/2;
    g.appendChild(el("path",{d:"M"+x1+","+y1+" C"+mid+","+y1+" "+mid+","+y2+" "+x2+","+y2,
      fill:"none",stroke:color,"stroke-opacity":lv===0?".55":".38","stroke-width":lv===0?"2":"1.4"}));
  });

  let bg,textFill,strokeAttrs={};
  if(lv===0){bg="#1a2b40";textFill="#ffffff";strokeAttrs={stroke:"#3a5f8f","stroke-width":"1.5"};}
  else if(lv===1){bg=color;textFill="#ffffff";strokeAttrs={stroke:"none"};}
  else if(lv===2){bg=lighten(color,45);textFill="#0d1520";strokeAttrs={stroke:"none"};}
  else if(lv===3&&node.children){bg=lighten(color,20);textFill="#ffffff";strokeAttrs={stroke:"none"};}
  else{
    bg = node.status==="Exists"?"rgba(40,167,69,0.12)":node.status==="Needs Update"?"rgba(255,193,7,0.10)":"rgba(220,53,69,0.10)";
    textFill="#e6edf5";
    let s,dash="";
    if(node.status==="Gap"){s=color;dash="5,3";}
    else if(node.status==="Needs Update"){s="#ffc107";dash="2,2";}
    else{s="#28a745";}
    strokeAttrs={stroke:s,"stroke-width":"1.5"};
    if(dash)strokeAttrs["stroke-dasharray"]=dash;
  }

  const rect=el("rect",Object.assign({x:x,y:y,width:nw,height:nh,rx:lv===0?"10":"6",fill:bg},strokeAttrs));
  if(done.has(node.name))rect.setAttribute("fill-opacity","0.45");
  g.appendChild(rect);

  const fontSize=lv===0?13:lv===1?11:lv===2?10:9;
  const lines=wrapToLines(node.name,nw-(node.children&&node.children.length?20:12),fontSize);
  const lh=fontSize+2.2;
  const startY=y+nh/2-((lines.length-1)*lh)/2+fontSize*0.35;
  lines.forEach((ln,i)=>{
    const t=el("text",{x:x+nw/2-((node.children&&node.children.length)?6:0),y:startY+i*lh,
      "text-anchor":"middle","font-size":fontSize,"font-family":'"Segoe UI",Calibri,sans-serif',
      fill:textFill,"font-weight":lv<=1?"600":lv===3&&node.children?"600":"400","pointer-events":"none"});
    t.textContent=ln; g.appendChild(t);
  });

  if(lv===4&&done.has(node.name)){
    const ck=el("text",{x:x+8,y:y+13,"font-size":"10",fill:"#7ee2a0","pointer-events":"none"});
    ck.textContent="✓"; g.appendChild(ck);
  }

  if(node.children&&node.children.length>0){
    const clickArea=el("rect",{x:x,y:y,width:nw,height:nh,rx:lv===0?"10":"6",
      fill:"rgba(0,0,0,0.001)","pointer-events":"all",cursor:"pointer"});
    clickArea.addEventListener("click",(e)=>{
      e.stopPropagation();
      if(isCollapsed(node)){
        collapsed.delete(node);
        node.children.forEach(c=>{if(c.children&&c.children.length>0)collapsed.add(c);});
      } else { collapsed.add(node); }
      redraw();
    });
    g.appendChild(clickArea);
    const circ=el("circle",{cx:x+nw-10,cy:y+nh/2,r:"6",fill:lv===0?"#2d4a6e":color,
      "fill-opacity":"0.85",stroke:"rgba(255,255,255,.35)","stroke-width":".8","pointer-events":"none"});
    const sign=el("text",{x:x+nw-10,y:y+nh/2+3.5,"text-anchor":"middle","font-size":"10",
      fill:"white","font-weight":"700","pointer-events":"none"});
    sign.textContent=isCollapsed(node)?"+":"−";
    g.appendChild(circ);g.appendChild(sign);
  } else if(lv>=4||!node.children){
    const overlay=el("rect",{x:x,y:y,width:nw,height:nh,rx:"6",fill:"rgba(0,0,0,0.001)",
      "pointer-events":"all",cursor:"pointer","data-title":String(node.name).replace(/\n/g," ")});
    g.appendChild(overlay);
    if(node.prio){
      const pc=node.prio==="High"?"#28a745":node.prio==="Medium"?"#ffc107":"#8a949e";
      g.appendChild(el("circle",{cx:x+nw-8,cy:y+8,r:"3.2",fill:pc,"pointer-events":"none"}));
    }
  }

  ch.forEach(renderTree);
}

function redraw(){
  while(g.firstChild)g.removeChild(g.firstChild);
  measure(DATA,0);
  place(DATA,0,0);
  renderTree(DATA);
  applyTransform();
}
function applyTransform(){
  g.setAttribute("transform","translate("+transform.x+","+transform.y+") scale("+transform.scale+")");
}

/* ---------------- delegated events ---------------- */
g.addEventListener("click",(e)=>{
  const title=e.target.getAttribute&&e.target.getAttribute("data-title");
  if(title){e.stopPropagation();openPanel(title);}
});
g.addEventListener("mousemove",(e)=>{
  const title=e.target.getAttribute&&e.target.getAttribute("data-title");
  const tip=document.getElementById("tooltip");
  if(title){
    tip.style.display="block";
    tip.style.left=(e.clientX+14)+"px";
    tip.style.top=(e.clientY-10)+"px";
    const d=DETAIL[title];
    tip.innerHTML="<strong>"+title+"</strong>"
      +(d?"<em style='display:block;margin-top:3px;color:#9fb6d0;font-style:normal'>"+d.fmt+" &middot; "+d.prio+" priority &middot; "+d.status+"</em>":"")
      +"<em style='display:block;margin-top:3px;color:#8ab4e0'>Click to see full details</em>";
  } else { tip.style.display="none"; }
});
g.addEventListener("mouseleave",()=>{document.getElementById("tooltip").style.display="none";});

/* ---------------- panel ---------------- */
const INTENT_C={Informational:["#16324f","#8ecbff"],Commercial:["#3b2a13","#ffc98a"],
  Transactional:["#12341f","#8ee0a8"],Navigational:["#2d2340","#c9aaff"]};
const PRIO_C={High:["#12341f","#8ee0a8"],Medium:["#3b3313","#ffe08a"],Low:["#26292d","#b8c0c8"]};

function chip(text,bg,fg){return '<span class="chip" style="background:'+bg+';color:'+fg+'">'+text+'</span>';}

function openPanel(title){
  const d=DETAIL[title];
  if(!d)return;
  current=title;
  document.getElementById("p-title").textContent=title;
  document.getElementById("p-query").textContent='"'+d.query+'"';
  document.getElementById("p-desc").textContent=d.desc;
  const pc=PRIO_C[d.prio]||PRIO_C.Low, ic=INTENT_C[d.intent]||INTENT_C.Informational;
  document.getElementById("p-chips").innerHTML=
    chip(d.prio+" Priority",pc[0],pc[1])+chip(d.intent,ic[0],ic[1])+chip(d.fmt,"#1d2b3d","#a9c4e0");
  document.getElementById("p-lt").innerHTML="&rarr; "+d.lt;
  const st=document.getElementById("p-status");
  st.textContent=d.status;
  if(d.status==="Exists"){st.style.background="#12341f";st.style.color="#8ee0a8";st.style.border="1px solid #28a745";}
  else if(d.status==="Needs Update"){st.style.background="#3b3313";st.style.color="#ffe08a";st.style.border="1px solid #ffc107";}
  else{st.style.background="#331417";st.style.color="#ff9ba5";st.style.border="1px dashed #dc3545";}
  document.getElementById("p-url").innerHTML=d.url
    ?'<h4>Existing URL</h4><a href="'+d.url+'" target="_blank" rel="noopener">'+d.url+"</a>":"";
  document.getElementById("p-crumb").innerHTML=d.core+" &rsaquo; "+d.sub+" &rsaquo; "+d.subsub;
  const b=document.getElementById("p-done");
  if(done.has(title)){b.classList.add("done");b.textContent="✓ Completed";}
  else{b.classList.remove("done");b.textContent="Mark Complete";}
  document.getElementById("panel").classList.add("open");
  document.getElementById("canvas-wrap").style.right="320px";
}
function closePanel(){
  document.getElementById("panel").classList.remove("open");
  document.getElementById("canvas-wrap").style.right="0";
  current=null;
}
function toggleDone(){
  if(!current)return;
  if(done.has(current))done.delete(current); else done.add(current);
  openPanel(current); redraw();
}

/* ---------------- controls ---------------- */
function eachNode(n,fn){fn(n);(n.children||[]).forEach(c=>eachNode(c,fn));}
function resetView(){
  collapsed.clear();
  eachNode(DATA,n=>{if(n._level===1&&n.children&&n.children.length)collapsed.add(n);});
  transform={x:60,y:0,scale:1};
  closePanel(); redraw(); centerY();
}
function expandAll(){collapsed.clear();redraw();centerY();}
function collapseDeep(){
  collapsed.clear();
  eachNode(DATA,n=>{if(n._level===3&&n.children&&n.children.length)collapsed.add(n);});
  redraw(); centerY();
}
function downloadPNG(){
  const bb=g.getBBox(),pad=40;
  const w=Math.ceil(bb.width+pad*2),h=Math.ceil(bb.height+pad*2);
  const clone=g.cloneNode(true);
  clone.setAttribute("transform","translate("+(pad-bb.x)+","+(pad-bb.y)+")");
  const s=document.createElementNS(NS,"svg");
  s.setAttribute("xmlns",NS);s.setAttribute("width",w);s.setAttribute("height",h);
  const bgr=document.createElementNS(NS,"rect");
  bgr.setAttribute("width",w);bgr.setAttribute("height",h);bgr.setAttribute("fill","#0d1520");
  s.appendChild(bgr);s.appendChild(clone);
  const str=new XMLSerializer().serializeToString(s);
  const img=new Image();
  img.onload=function(){
    const cv=document.createElement("canvas");
    cv.width=w*2;cv.height=h*2;
    const ctx=cv.getContext("2d");ctx.scale(2,2);ctx.drawImage(img,0,0);
    const a=document.createElement("a");
    a.download="{{PNG_FILENAME}}";
    a.href=cv.toDataURL("image/png");a.click();
  };
  img.src="data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(str)));
}

/* ---------------- pan & zoom ---------------- */
let dragging=false,panReady=false,panStartX=0,panStartY=0,lastX=0,lastY=0;
svgEl.addEventListener("mousedown",(e)=>{
  panReady=true;panStartX=e.clientX;panStartY=e.clientY;lastX=e.clientX;lastY=e.clientY;
});
window.addEventListener("mousemove",(e)=>{
  if(!panReady)return;
  const dx=e.clientX-panStartX,dy=e.clientY-panStartY;
  if(!dragging&&Math.sqrt(dx*dx+dy*dy)<5)return;
  dragging=true;svgEl.classList.add("dragging");
  transform.x+=e.clientX-lastX;transform.y+=e.clientY-lastY;
  lastX=e.clientX;lastY=e.clientY;applyTransform();
});
window.addEventListener("mouseup",()=>{panReady=false;dragging=false;svgEl.classList.remove("dragging");});
svgEl.addEventListener("wheel",(e)=>{
  e.preventDefault();
  const r=svgEl.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  const f=e.deltaY<0?1.1:1/1.1;
  const ns=Math.max(0.2,Math.min(2.6,transform.scale*f));
  const k=ns/transform.scale;
  transform.x=mx-(mx-transform.x)*k;
  transform.y=my-(my-transform.y)*k;
  transform.scale=ns;applyTransform();
},{passive:false});
document.addEventListener("keydown",(e)=>{if(e.key==="Escape")closePanel();});

/* ---------------- init ---------------- */
function fitChrome(){
  const h=document.getElementById("header").offsetHeight+document.getElementById("stats").offsetHeight;
  document.getElementById("canvas-wrap").style.top=h+"px";
  document.getElementById("panel").style.top=document.getElementById("header").offsetHeight+"px";
  return h;
}
function centerY(){
  const top=fitChrome(),bb=g.getBBox();
  transform.y=(window.innerHeight-top)/2-(bb.y+bb.height/2)*transform.scale;
  applyTransform();
}
window.addEventListener("resize",fitChrome);
tagParents(DATA,null);
measure(DATA,0);
eachNode(DATA,n=>{if(n._level===1&&n.children&&n.children.length)collapsed.add(n);});
redraw();
centerY();
</script>
